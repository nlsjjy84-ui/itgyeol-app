# master에 올라갈 때마다 웹 버전을 만들어 GitHub Pages에 자동으로 공개한다.
# 주소: https://nlsjjy84-ui.github.io/itgyeol-app/
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests (순수 계산 테스트 — 실패하면 배포 안 함)
        run: npm test
      - name: Check translations (언어팩 점검)
        run: npm run i18n:check
      - name: Browser tests (브라우저로 화면을 끝까지 눌러 보는 테스트 — 실패하면 배포 안 함)
        run: |
          npm ci --prefix tools/itgyeol-gift
          npx playwright install --with-deps chromium
          npm run e2e:build
          npm run e2e
      - name: Browser test report (실패했을 때 화면 기록)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results
          retention-days: 7
      - name: Export web
        run: npx expo export -p web --output-dir dist
        env:
          EXPO_BASE_URL: /itgyeol-app
      - name: SPA fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Intro page (소개 화면 — web-landing/site 를 /itgyeol-app/intro/ 로)
        run: mkdir -p dist/intro && cp -r web-landing/site/. dist/intro/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check order server (잇결 주문·전시 서버가 살아 있는지 — 죽어 있으면 경고만 띄움)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://itgyeol-gift.vercel.app/api/pay || echo 000)
          echo "itgyeol-gift /api/pay -> $code"
          if [ "$code" != "200" ]; then echo "::warning::잇결 주문 서버(/api/pay)가 $code 입니다. fix-server.bat 로 서버를 다시 올려 주세요."; fi
