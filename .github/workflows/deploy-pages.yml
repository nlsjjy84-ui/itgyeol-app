# master에 올라갈 때마다 웹 버전을 만들어 GitHub Pages에 자동으로 공개한다.
# 주소: https://nlsjjy84-ui.github.io/itgyeol-app/
name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests (순수 계산 테스트 — 실패하면 배포 안 함)
        run: npm test
      - name: Check translations (언어팩 점검)
        run: npm run i18n:check
      - name: Export web
        run: npx expo export -p web --output-dir dist
        env:
          EXPO_BASE_URL: /itgyeol-app
      - name: SPA fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
