<script type="module">
import * as THREE from 'three';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const S = new URLSearchParams(location.search).get('s') || 'A';
const W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 500);
const pmrem = new THREE.PMREMGenerator(renderer);
const hdr = await new HDRLoader().loadAsync('./studio.hdr');
scene.environment = pmrem.fromEquirectangular(hdr).texture;
const tl = new THREE.TextureLoader();
const tex = async (u) => { const t = await tl.loadAsync(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

// ---------- 재료
const metal = (c = 0xd6d9de, r = 0.18) => new THREE.MeshStandardMaterial({ color: c, metalness: 1, roughness: r });
const gold = () => metal(0xd4b06a, 0.22);
function noiseTex(base, amp = 18, scale = 1, size = 512) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  const id = g.createImageData(size, size); const [r0, g0, b0] = base;
  for (let i = 0; i < size * size; i++) { const n = (Math.random() - 0.5) * amp; id.data[i * 4] = r0 + n; id.data[i * 4 + 1] = g0 + n; id.data[i * 4 + 2] = b0 + n; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(scale, scale); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function bgGradient(top, bottom) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// ---------- 부품
function tube(points, r, mat, closed = false, seg = 200) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 20, closed), mat); m.castShadow = true; m.receiveShadow = true; return m;
}
// 열쇠 고리(두 바퀴 감긴 납작 고리)
function splitRing(R = 1.5, wire = 0.11, mat = metal()) {
  const pts = []; const turns = 1.92;
  for (let i = 0; i <= 300; i++) { const a = (i / 300) * Math.PI * 2 * turns; pts.push(new THREE.Vector3(Math.cos(a) * R, Math.sin(a) * R, (i / 300 - 0.5) * wire * 2.3)); }
  const g = new THREE.Group(); g.add(tube(pts, wire, mat, false, 600));
  return g;
}
// 체인 고리 하나 (타원)
function link(len = 0.62, wid = 0.36, wire = 0.055, mat = metal()) {
  const pts = []; for (let i = 0; i < 64; i++) { const a = (i / 64) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * wid / 2, Math.sin(a) * len / 2, 0)); }
  return tube(pts, wire, mat, true, 96);
}
function chain(n, from, mat = metal(), len = 0.62) {
  const g = new THREE.Group(); const step = len * 0.72;
  for (let i = 0; i < n; i++) { const l = link(len, 0.36, 0.055, mat); l.position.set(from.x, from.y - i * step, from.z); l.rotation.y = i % 2 ? Math.PI / 2 : 0; g.add(l); }
  return { group: g, end: new THREE.Vector3(from.x, from.y - (n - 1) * step - len * 0.4, from.z) };
}
function jumpRing(r = 0.26, wire = 0.05, mat = metal()) { const t = new THREE.Mesh(new THREE.TorusGeometry(r, wire, 16, 48), mat); t.castShadow = true; return t; }
// 유물 사진 판(배경 지운 진짜 사진) — 그림자도 실루엣 그대로
async function relic(url, width) {
  const t = await tex(url); const ar = t.image.height / t.image.width;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * ar), new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, toneMapped: false }));
  m.castShadow = true;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: 0.5 });
  m.userData.h = width * ar; return m;
}
function keyLight(x, y, z, I = 2.6, size = 14) {
  const l = new THREE.DirectionalLight(0xffffff, I); l.position.set(x, y, z); l.castShadow = true;
  l.shadow.mapSize.set(2048, 2048); const c = l.shadow.camera; c.left = c.bottom = -size; c.right = c.top = size; c.near = 0.5; c.far = 120; l.shadow.radius = 6; l.shadow.bias = -0.0004;
  scene.add(l); return l;
}
function backdrop(color) { // 스튜디오 쓸어내린 배경(벽+바닥이 이어짐)
  const shape = []; for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI / 2; shape.push(new THREE.Vector2(0, 0)); }
  const geo = new THREE.PlaneGeometry(200, 200); const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
  m.position.z = -3; m.receiveShadow = true; scene.add(m); return m;
}
const R = { dog: './r63907.png', bell: './r111105.png' };

// ---------- 장면
async function A() { // 토우 · 금속 열쇠고리 키링
  scene.background = bgGradient('#ece7df', '#d9d1c4'); backdrop(0xe6e0d6);
  keyLight(-8, 14, 16, 2.4); scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dog = await relic(R.dog, 5.6); dog.position.set(0, -2.4, 0); scene.add(dog);
  const top = dog.position.y + dog.userData.h / 2; const ax = -5.6 * (0.45 - 0.5);
  const anchor = new THREE.Vector3(dog.position.x - ax, top - dog.userData.h * 0.34, -0.05);
  const eye = jumpRing(0.24, 0.05, gold()); eye.position.set(anchor.x, anchor.y + 0.22, -0.02); scene.add(eye);
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.35, 12), gold()); pin.position.set(anchor.x, anchor.y, -0.06); scene.add(pin);
  const ch = chain(7, new THREE.Vector3(anchor.x, anchor.y + 0.62 + 7 * 0.45, -0.02), gold()); scene.add(ch.group);
  const jr = jumpRing(0.3, 0.06, gold()); jr.position.set(anchor.x, anchor.y + 0.65 + 7 * 0.45, -0.02); jr.rotation.y = Math.PI / 2; scene.add(jr);
  const ring = splitRing(1.55, 0.12, gold()); ring.position.set(anchor.x, jr.position.y + 1.75, -0.02); ring.rotation.set(0.25, 0.5, 0); scene.add(ring);
  camera.position.set(0, 1.6, 24); camera.lookAt(0, 1.6, 0);
}

  const top = dog.position.y + dog.userData.h / 2; const ax = -5.6 * (0.45 - 0.5);
  const ay = top - dog.userData.h * 0.34;
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.35, 12), metal(0xb9bcc2)); pin.position.set(-ax, ay, -0.06); scene.add(pin);
  const eye = jumpRing(0.24, 0.05, metal(0xb9bcc2)); eye.position.set(-ax, ay + 0.22, -0.02); scene.add(eye);
  const jr = jumpRing(0.34, 0.06, metal(0xb9bcc2)); jr.position.set(-ax, ay + 0.75, -0.02); jr.rotation.y = Math.PI / 2; scene.add(jr);
  // D고리
  const dpts = []; for (let i = 0; i <= 80; i++) { const a = Math.PI * (i / 80); dpts.push(new THREE.Vector3(Math.cos(a) * 0.9, -Math.sin(a) * 0.9, 0)); }
  dpts.push(new THREE.Vector3(-0.9, 0.15, 0)); dpts.push(new THREE.Vector3(0.9, 0.15, 0));
  const dr = tube(dpts, 0.1, metal(0xb9bcc2), true, 160); dr.position.set(-ax, ay + 2.0, 0.05); scene.add(dr);
  // 가죽 끈 — 접힌 띠(위로 고리를 만든 납작한 띠)
  const leather = new THREE.MeshStandardMaterial({ color: 0x6b3a1f, roughness: 0.62, map: noiseTex([120, 68, 36], 22, 3), bumpMap: noiseTex([128, 128, 128], 60, 6), bumpScale: 0.02 });
  const sh = new THREE.Shape(); sh.moveTo(-0.62, -0.06); sh.lineTo(0.62, -0.06); sh.lineTo(0.62, 0.06); sh.lineTo(-0.62, 0.06); sh.closePath();
  const path = new THREE.CatmullRomCurve3([new THREE.Vector3(-ax, ay + 2.15, 0.15), new THREE.Vector3(-ax, ay + 4.5, 0.35), new THREE.Vector3(-ax, ay + 6.3, 0.2), new THREE.Vector3(-ax, ay + 6.9, -0.3), new THREE.Vector3(-ax, ay + 6.3, -0.75), new THREE.Vector3(-ax, ay + 4.5, -0.6), new THREE.Vector3(-ax, ay + 2.15, -0.15)]);
  const strap = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { steps: 200, extrudePath: path, bevelEnabled: false }), leather); strap.castShadow = true; scene.add(strap);
  const rivet = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.2, 24), metal(0xc9ccd2, 0.25)); rivet.rotation.x = Math.PI / 2; rivet.position.set(-ax, ay + 3.0, 0.0); scene.add(rivet);
  camera.position.set(1.0, 0.6, 25); camera.lookAt(0, 0.6, 0);
}
async function C() { // 토우 · 휴대폰 그립톡 (탁자 위 폰, 카메라를 가리지 않는 아래쪽 자리)

  keyLight(-10, 22, 10, 2.6, 16); scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const body = new THREE.Mesh(new RoundedBoxGeometry(7.6, 0.8, 15.8, 6, 0.9), new THREE.MeshPhysicalMaterial({ color: 0x2b2f35, roughness: 0.35, metalness: 0.2, clearcoat: 1, clearcoatRoughness: 0.15 }));
  body.position.y = 0.4; body.castShadow = true; body.receiveShadow = true; scene.add(body);
  const cam = new THREE.Mesh(new RoundedBoxGeometry(3.0, 0.3, 3.0, 4, 0.6), new THREE.MeshPhysicalMaterial({ color: 0x3a3f46, roughness: 0.25, clearcoat: 1 })); cam.position.set(-1.9, 0.92, -5.6); cam.castShadow = true; scene.add(cam);
  for (const [x, z] of [[-2.5, -6.2], [-1.3, -5.0]]) {
    const ringM = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.22, 40), metal(0x9aa0a8, 0.15)); ringM.position.set(x, 1.12, z); scene.add(ringM);
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.24, 40), new THREE.MeshPhysicalMaterial({ color: 0x05070a, roughness: 0.05, metalness: 0.2, clearcoat: 1 })); glass.position.set(x, 1.14, z); scene.add(glass);
  }
  // 그립 받침 — 화면 아래쪽 1/3 지점(카메라와 겹치지 않음)
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.1, 0.55, 64), new THREE.MeshPhysicalMaterial({ color: 0xe8e2d8, roughness: 0.35, clearcoat: 0.6 })); base.position.set(0, 1.05, 2.4); base.castShadow = true; scene.add(base);
  const dog = await relic(R.dog, 4.2); dog.position.set(0, 1.3 + dog.userData.h / 2, 2.4); scene.add(dog);
  camera.position.set(-6, 11, 20); camera.lookAt(0, 1.8, 0); camera.fov = 32; camera.updateProjectionMatrix();
}
async function E() { // 방울 · 룸미러 걸이 방향제
  scene.background = bgGradient('#a9bccb', '#d8e0e4');
  keyLight(-6, 16, 18, 2.2); scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 2.2, 24), new THREE.MeshStandardMaterial({ color: 0x1e2023, roughness: 0.5 })); stem.position.set(0, 9.6, -0.5); scene.add(stem);
  const mirror = new THREE.Mesh(new RoundedBoxGeometry(17, 4.6, 1.6, 6, 0.9), new THREE.MeshStandardMaterial({ color: 0x1a1c1f, roughness: 0.45 })); mirror.position.set(0, 7.4, -0.6); mirror.castShadow = true; scene.add(mirror);
  const glass = new THREE.Mesh(new RoundedBoxGeometry(16.0, 3.7, 0.2, 4, 0.6), new THREE.MeshStandardMaterial({ color: 0xb7c6cf, metalness: 0.6, roughness: 0.06 })); glass.position.set(0, 7.4, 0.25); scene.add(glass);
  // 땋은 끈 — 거울 받침에서 방울 고리까지, 사이에 매듭
  const cordM = new THREE.MeshStandardMaterial({ color: 0x7a1f1a, roughness: 0.8, map: noiseTex([122, 31, 26], 30, 6) });

  const loopTop = bell.position.y + bell.userData.h / 2 - bell.userData.h * 0.03;
  const L = tube([new THREE.Vector3(-0.15, 5.2, -0.2), new THREE.Vector3(-0.1, 3.0, 0.2), new THREE.Vector3(0, 1.0, 0.55), new THREE.Vector3(0.02, loopTop + 0.3, 0.6)], 0.1, cordM);
  const R2 = tube([new THREE.Vector3(0.15, 5.2, -0.2), new THREE.Vector3(0.1, 3.0, 0.2), new THREE.Vector3(0, 1.0, 0.55), new THREE.Vector3(-0.02, loopTop + 0.3, 0.6)], 0.1, cordM);
  scene.add(L, R2);
  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), cordM); knot.scale.set(1, 1.25, 1); knot.position.set(0, 1.0, 0.55); knot.castShadow = true; scene.add(knot);
  const tieUp = tube([new THREE.Vector3(-0.3, 5.15, -0.3), new THREE.Vector3(0, 5.5, 0.1), new THREE.Vector3(0.3, 5.15, -0.3)], 0.08, cordM); scene.add(tieUp);
  // 걸친 고리(거울 받침을 감은 부분)
  camera.position.set(0, 1.4, 42); camera.lookAt(0, 1.4, 0);

  scene.background = bgGradient('#2a2b2f', '#141518');

async function G() { // 방울 · 현관 도어벨
  const wood = new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 0.7, map: (() => { const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const g = c.getContext('2d'); g.fillStyle = '#8a5a36'; g.fillRect(0,0,512,1024); for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(${60+Math.random()*30},${35+Math.random()*20},${18},${0.25+Math.random()*0.3})`; g.lineWidth = 1 + Math.random() * 3; g.beginPath(); const x = Math.random() * 512; g.moveTo(x, 0); for (let y = 0; y <= 1024; y += 32) g.lineTo(x + Math.sin(y / 90 + i) * 8, y); g.stroke(); } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })() });

async function Hh() { // 방울 · 가방 참 (카라비너)
  scene.background = bgGradient('#e8e3da', '#d2c9bb'); backdrop(0xe0d9cd);
  keyLight(-8, 14, 16, 2.4); scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const bell = await relic(R.bell, 5.0); bell.position.set(0, -3.0, 0); scene.add(bell);
  const loopTop = bell.position.y + bell.userData.h / 2 - bell.userData.h * 0.04;
  const jr = jumpRing(0.4, 0.07, metal(0xc9ccd2, 0.2)); jr.position.set(0, loopTop + 0.2, 0.05); jr.rotation.y = Math.PI / 2; scene.add(jr);
